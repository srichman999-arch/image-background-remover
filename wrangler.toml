name = "image-background-remover"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 关键：使用 next-on-pages 构建后的输出目录
# @cloudflare/next-on-pages 会输出到 .vercel/output/static
pages_build_output_dir = ".vercel/output/static"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "image-background-remover-db"
database_id = "133876b7-3f25-4cf7-9c09-40e55bc5e1b3"  # 替换为真实的 UUID

# 环境变量
[vars]
NEXTAUTH_URL = "https://image-background-remover.blog"
