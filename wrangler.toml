name = "image-background-remover"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Pages Functions 配置
[build]
command = "npx @cloudflare/next-on-pages"

# 环境变量（生产环境）
[env.production.vars]
NEXTAUTH_URL = "https://image-background-remover.blog"

# D1 数据库绑定
[[env.production.d1_databases]]
binding = "DB"
database_name = "image-background-remover-db"
database_id = "替换为你的实际数据库ID"

# 本地开发环境
[env.development.vars]
NEXTAUTH_URL = "http://localhost:3000"

[[env.development.d1_databases]]
binding = "DB"
database_name = "image-background-remover-db-dev"
database_id = "替换为你的开发数据库ID"
